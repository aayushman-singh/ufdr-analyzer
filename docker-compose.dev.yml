version: '3.8'

services:
  # PostgreSQL Database - Essential for development
  postgres:
    image: postgres:15-alpine
    container_name: ufdr_postgres_dev
    environment:
      POSTGRES_DB: ufdr_analyzer
      POSTGRES_USER: ufdr_user
      POSTGRES_PASSWORD: ufdr_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufdr_user -d ufdr_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ufdr_dev_network

  # MeiliSearch - Optional but recommended for search functionality
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: ufdr_meilisearch_dev
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_dev_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ufdr_dev_network

volumes:
  postgres_dev_data:
    driver: local
  meilisearch_dev_data:
    driver: local

networks:
  ufdr_dev_network:
    driver: bridge

