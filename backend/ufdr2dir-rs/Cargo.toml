[package]
name = "ufdr2dir-rs"
version = "0.1.10"
edition = "2021"
authors = ["UFDR Analyzer Team"]

[[bin]]
name = "ufdr2dir"
path = "src/main.rs"

[dependencies]
# ZIP file handling
zip = "0.6"

# XML parsing
quick-xml = "0.31"

# Parallel processing
rayon = "1.8"

# CLI parsing
clap = { version = "4.4", features = ["derive"] }

# Progress bars
indicatif = { version = "0.17", features = ["rayon"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Hashing for path shortening
md5 = "0.7"

# JSON for path mapping
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Path handling
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
